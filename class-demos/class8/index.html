<html>
<!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
<!-- A: Meta information (title, stylesheet) goes in side the <head>. 
    It doesn't show up on the webpage but on the name of the browser tab-->

<head>
    <title>class 5 demo 😌</title>
    <link href="style.css" rel="stylesheet"/>
    <!-- New: Link Javascript file -->
    <script src="main.js"></script>

</head>

<!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
<!-- A: It does! All forms of content?
 including <p> <img> <button> etc.-->

<body>

    <p>this is a paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p id="main">this is a third paragraph</p>

    <div id="blue-div"></div>
    <!-- now open up style.css -->
</body>

</html>
