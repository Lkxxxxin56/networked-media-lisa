<!-- class notes:
 HTML is a markup language that is used to create web pages.
 
 HTML stands for HyperText Markup Language.

<html> is a parent of:
    child1: <body>
    child2: <head>

Anything inside <head> is not visible on the page, 
    but it can be used to provide information about the page. 
    For example, the <title> tag sets the title of the page, 
    which is displayed in the browser tab.
-->

<html>
    <head>
        <title> 🤓 Class 2 Demo </title> 
    </head>

    <!-- <body> holds all the content that is visible on the page.  -->
    <body>
    this is some text on my webpage.
    <!-- save file (Cmd + S) -> refresh browser (Cmd + R)-->
    
    <!-- tags! -->
    <!-- block & inline elements: 
        - block elements start on a new line and take up the full width available.
            e.g. <p>
        - inline elements do not start on a new line and only take up as much width as necessary
            e.g. <em> <strong> <a> <span>
        -->
    <h1>HEADER</h1>
    <p>This is a paragraph.</p>
    <p>This has <em>italics</em>.</p>
    <strong>this is bolded, but no <\p> </strong>
    <em>this is an entire italic sentence</em>
    <span>hello world</span>
    <!-- break -->
    <br />
    <!-- horizontal rule -->
    <hr /> 
    
    <!-- usually we want to resize our images outside of VS code -->
    <img src="images/schedule.png"/>
    <!-- we can also use URLs from an image hosted somewhere else on the web -->
    <img src="https://example.com/image.png"/>



    </body>

</html>
